name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gclient/package-lock.json
            gserver/package-lock.json

      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test
      - run: npm run package

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gclient/package-lock.json
            gserver/package-lock.json

      - run: npm ci
      - run: xvfb-run -a npm run test:coverage

      - name: Upload coverage summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-summary-${{ github.run_attempt }}
          path: coverage/combined/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 3

  windows-e2e:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gclient/package-lock.json
            gserver/package-lock.json

      - run: npm ci
      - run: npm run test:e2e
